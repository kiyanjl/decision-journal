<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decision Journal Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for in-browser JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        body { background-color: #111827; color: #d1d5db; font-family: 'Inter', sans-serif; }
        .card { background-color: #1f2937; border: 1px solid #374151; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1); margin-bottom: 20px; }
        .grid-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        @media (max-width: 1024px) {
            .grid-layout { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Fallback if CDNs fail to load (e.g., offline) -->
    <script>
        window.addEventListener('load', function() {
            if (typeof React === 'undefined') {
                document.getElementById('root').innerHTML = '<div style="padding: 20px; font-family: sans-serif; color: red;"><h2>Error Loading UI</h2><p>Could not load React from CDN. Please check your internet connection and ensure your browser isn\'t blocking the scripts.</p></div>';
            }
        });
    </script>

    <script type="text/babel">
const { useState, useEffect, useRef } = React;

function App() {
    const [version, setVersion] = useState("v1.2.0");
    const [decision, setDecision] = useState(null);
    const [events, setEvents] = useState([]);
    const [history, setHistory] = useState([]);
    const [humanTrace, setHumanTrace] = useState([]);
    const [traceableItems, setTraceableItems] = useState([]);
    const [modalContent, setModalContent] = useState(null);
    const [loading, setLoading] = useState(true);

    const API_BASE = "http://localhost:8000";

    const fetchData = async () => {
        setLoading(true);
        try {
            const [decRes, evRes, histRes, humanTraceRes, traceableRes] = await Promise.all([
                fetch(`${API_BASE}/decision/${version}`),
                fetch(`${API_BASE}/timeline/${version}`),
                fetch(`${API_BASE}/history`),
                fetch(`${API_BASE}/trace/human/${version}`),
                fetch(`${API_BASE}/traceable_items/${version}`)
            ]);
            
            if (decRes.ok) setDecision(await decRes.json());
            if (evRes.ok) setEvents(await evRes.json());
            if (histRes.ok) setHistory(await histRes.json());
            if (humanTraceRes.ok) setHumanTrace(await humanTraceRes.json());
            if (traceableRes.ok) setTraceableItems(await traceableRes.json());
        } catch (error) {
            console.error("Failed to fetch data", error);
        }
        setLoading(false);
    };

    useEffect(() => {
        fetchData();
    }, [version]);

    const showTrace = async (reqId) => {
        setModalContent({ loading: true, reqId }); // Show loading state immediately
        try {
            const res = await fetch(`${API_BASE}/trace/${reqId}`);
            if (res.ok) {
                const data = await res.json();
                setModalContent(data);
            } else {
                setModalContent({ error: `Could not load trace for ${reqId}` });
            }
        } catch (error) {
            setModalContent({ error: 'Failed to fetch trace data.' });
        }
    };

    if (loading) return <div className="p-10 text-center font-bold text-xl">Loading Decision Journal...</div>;
    if (!decision) return (
        <div className="p-10 text-center text-red-600">
            <h1 className="text-2xl font-bold mb-4">API Offline or No Data</h1>
            <p>Could not connect to the backend API.</p>
            <p>Please ensure the FastAPI server is running and accessible at {API_BASE}.</p>
        </div>
    );

    const isProblemEvent = (type) => {
        if (!type) return false;
        return type.includes('FAIL') || type.includes('CONFLICT') || type.includes('REJECT') || type.includes('MISSING');
    }

    const isRejected = decision?.status === "REJECTED";

    return (
        <>
        <TraceabilityModal content={modalContent} onClose={() => setModalContent(null)} isProblemEvent={isProblemEvent} />
        <div className="max-w-7xl mx-auto p-6">
            <header className="flex justify-between items-center mb-8 border-b border-gray-700 pb-4">
                <div>
                    <h1 className="text-3xl font-extrabold text-white">Decision Journal</h1>
                    <p className="text-sm text-gray-400 mt-1">Final Audit & Traceability System</p>
                </div>
                <div className="flex gap-2 items-center">
                    <span className="font-semibold text-gray-400">History:</span>
                    {(history || []).map(h => (
                        <button 
                            key={h.version}
                            onClick={() => setVersion(h.version)}
                            className={`px-3 py-1 rounded text-sm font-bold border transition-colors ${
                                h.version === version ? 'bg-red-600 text-white border-red-500' : 'bg-gray-700 text-gray-300 border-gray-600 hover:bg-gray-600'
                            }`}
                        >
                            {h.version} {h.status === 'APPROVED' ? '✔' : '✖'}
                        </button>
                    ))}
                </div>
            </header>

            <div className="grid-layout">
                {/* Main Content */}
                <div>
                    {/* Summary Header */}
                    <div className={`card text-white flex justify-between items-center ${isRejected ? 'bg-red-900/50 border-red-700' : 'bg-green-900/50 border-green-700'}`}>
                        <div>
                            <h2 className="text-2xl font-bold">Version {decision.version}</h2>
                            <p className="opacity-80">Timestamp: {decision.timestamp ? new Date(decision.timestamp).toLocaleString() : 'N/A'}</p>
                        </div>
                        <div className="text-right">
                            <div className="text-xl font-black tracking-wider">{decision.status}</div>
                            <div className="text-sm font-bold">Risk: {decision.risk_level || 'N/A'}</div>
                        </div>
                    </div>

                    {/* Problems */}
                    {decision.problems && decision.problems.length > 0 && (
                        <div className="card border-l-4 border-red-500">
                            <h3 className="text-lg font-bold text-red-400 mb-2">🔴 Key Problems</h3>
                            <ul className="list-disc pl-5 space-y-1">
                                {decision.problems.map((p, i) => <li key={i} className="text-gray-300">{p}</li>)}
                            </ul>
                        </div>
                    )}

                    {/* Decision Journal Details */}
                    <div className="card">
                        <h3 className="text-lg font-bold text-white mb-3">📄 Decision Reasoning</h3>
                        <div className="space-y-3 bg-gray-900 p-4 rounded border border-gray-700">
                            <div><span className="font-bold text-gray-400">Change context:</span> {decision.decision?.change || 'N/A'}</div>
                            <div><span className="font-bold text-gray-400">System Impact:</span> {decision.decision?.impact || 'N/A'}</div>
                            <div><span className="font-bold text-gray-400">Assumption:</span> {decision.decision?.assumption || 'N/A'}</div>
                            <div><span className="font-bold text-gray-400">Alternatives:</span> {decision.decision?.alternatives || 'N/A'}</div>
                            <div>
                                <span className="font-bold text-gray-600">AI Recommendation:</span> 
                                <span className={`ml-2 px-2 py-1 text-xs font-bold rounded ${decision.decision?.recommendation === 'Delay' ? 'bg-yellow-200 text-yellow-800' : 'bg-green-200 text-green-800'}`}>
                                    {decision.decision?.recommendation || 'Unknown'}
                                </span>
                            </div>
                        </div>
                    </div>

                    {/* Timeline */}
                    <div className="card">
                        <h3 className="text-lg font-bold text-white mb-4">🕒 Event Timeline</h3>
                        <div className="relative border-l-2 border-gray-700 ml-3 space-y-6">
                            {(events || []).map((ev, i) => (
                                <div key={i} className="pl-6 relative">
                                    <div className={`absolute w-3 h-3 rounded-full -left-[7px] top-1.5 ${isProblemEvent(ev.type) ? 'bg-red-500' : 'bg-blue-500'}`}></div>
                                    <div className="text-xs text-gray-500 font-mono">{ev.timestamp ? new Date(ev.timestamp).toLocaleTimeString() : ''}</div>
                                    <div className="font-bold text-white">{ev.type} <span className="text-sm font-normal text-gray-400 bg-gray-700 px-1 rounded ml-1">{ev.layer || 'System'}</span></div>
                                    <div className="text-sm text-gray-600">{ev.description || 'No description'}</div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>

                {/* Sidebar */}
                <div>
                    {/* Graph */}
                    <div className="card">
                        <h3 className="text-lg font-bold text-white mb-4">📊 Test Status</h3>
                        {decision.summary ? <TestStatusChart summary={decision.summary} /> : <div className="text-sm text-gray-500">No coverage data provided by backend.</div>}
                    </div>

                    {/* Human Traceability */}
                    <div className="card">
                        <h3 className="text-lg font-bold text-white mb-3">👤 Human Traceability</h3>
                        <ul className="space-y-2 text-sm">
                            {(humanTrace || []).map((trace, i) => (
                                <li key={i} className="flex justify-between items-center bg-gray-900 p-2 rounded">
                                    <span className="text-gray-600">{trace.role}</span>
                                    <span className="font-bold text-white">{trace.person}</span>
                                </li>
                            ))}
                            {humanTrace.length === 0 && <p className="text-gray-500">No human trace data for this version.</p>}
                        </ul>
                    </div>

                    <div className="card bg-red-900/20 border border-red-800">
                        <h3 className="text-lg font-bold text-red-400 mb-3">🔗 System Traceability</h3>
                        <p className="text-sm text-gray-500 mb-4">Click an item to trace its full event history.</p>
                        
                        <div className="space-y-2">
                            {(traceableItems || []).map(reqId => (
                                <button 
                                    key={reqId}
                                    onClick={() => showTrace(reqId)}
                                    className="w-full text-left p-2 bg-gray-700 border border-gray-600 rounded hover:bg-gray-600 text-sm font-medium text-red-400 transition-colors"
                                >
                                    Trace {reqId}
                                </button>
                            ))}
                            {traceableItems.length === 0 && <p className="text-sm text-gray-500">No traceable items for this version.</p>}
                        </div>
                    </div>
                </div>
            </div>
        </div>
        </>
    );
}

function TraceabilityModal({ content, onClose, isProblemEvent }) {
    if (!content) return null;

    // Handle loading and error states
    if (content.loading) {
        return (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50">
                <div className="bg-gray-800 p-8 rounded-lg shadow-xl text-white">Loading trace for {content.reqId}...</div>
            </div>
        );
    }
    if (content.error) {
        return (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50" onClick={onClose}>
                <div className="bg-gray-800 p-8 rounded-lg shadow-xl text-red-400">
                    <p>{content.error}</p>
                    <button onClick={onClose} className="mt-4 px-4 py-2 bg-red-600 text-white rounded">Close</button>
                </div>
            </div>
        );
    }

    return (
        <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4" onClick={onClose}>
            <div className="bg-gray-800 border border-gray-600 rounded-lg shadow-xl w-full max-w-2xl text-gray-300" onClick={e => e.stopPropagation()}>
                <header className="p-4 border-b border-gray-700 flex justify-between items-center">
                    <h2 className="text-xl font-bold text-white">Traceability for: {content.req_id}</h2>
                    <button onClick={onClose} className="text-gray-400 hover:text-white text-2xl leading-none">&times;</button>
                </header>
                <div className="p-6 max-h-[70vh] overflow-y-auto">
                    <div className="grid grid-cols-2 gap-4 mb-6">
                        <div className="bg-gray-700/50 p-3 rounded">
                            <div className="text-xs text-gray-400">Requirement ID</div>
                            <div className="font-mono font-bold text-white">{content.req_id}</div>
                        </div>
                        <div className="bg-gray-700/50 p-3 rounded">
                            <div className="text-xs text-gray-400">Test ID</div>
                            <div className="font-mono font-bold text-white">{content.test_id || 'N/A'}</div>
                        </div>
                    </div>
                    <h3 className="font-bold text-lg mb-3 text-white">Related Events</h3>
                    <div className="space-y-4">
                        {(content.events_details || []).map(event => (
                            <div key={event.event_id} className={`bg-gray-900 p-3 rounded border-l-4 ${isProblemEvent(event.type) ? 'border-red-500' : 'border-blue-500'}`}>
                                <div className="flex justify-between items-center">
                                    <span className={`font-bold ${isProblemEvent(event.type) ? 'text-red-400' : 'text-blue-400'}`}>{event.type}</span>
                                    <span className="text-xs font-mono text-gray-500">{new Date(event.timestamp).toLocaleString()}</span>
                                </div>
                                <p className="text-sm text-gray-400 mt-1">{event.description}</p>
                            </div>
                        ))}
                        {(content.events_details || []).length === 0 && <p className="text-gray-500">No events linked to this requirement.</p>}
                    </div>
                </div>
            </div>
        </div>
    );
}

// Renamed and updated Chart.js wrapper
function TestStatusChart({ summary }) {
    const chartRef = useRef(null);
    const chartInstance = useRef(null);

    useEffect(() => {
        if (chartInstance.current) {
            chartInstance.current.destroy();
        }

        const ctx = chartRef.current.getContext('2d');
        chartInstance.current = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Passed', 'Failed', 'Missing'],
                datasets: [{
                    label: 'Requirements',
                    data: [
                        summary.passed, 
                        summary.failed, 
                        summary.missing
                    ],
                    backgroundColor: ['#166534', '#991b1b', '#b45309'],
                    borderColor: ['#16a34a', '#dc2626', '#d97706'],
                    borderWidth: 1,
                    borderRadius: 4
                }]
            },
            options: {
                indexAxis: 'y',
                responsive: true,
                plugins: { legend: { display: false }, title: { display: false } },
                scales: { 
                    x: { beginAtZero: true, ticks: { stepSize: 1, color: '#9ca3af' }, grid: { color: '#374151' } },
                    y: { ticks: { color: '#9ca3af' }, grid: { color: '#374151' } }
                }
            }
        });

        return () => {
            if (chartInstance.current) {
                chartInstance.current.destroy();
            }
        }
    }, [summary]);

    return <canvas ref={chartRef}></canvas>;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
    </script>
</body>
</html>
